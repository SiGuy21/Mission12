# Builds the Vite React app and deploys to Azure Static Web Apps.
# Prerequisites in Azure Portal: create a Static Web App, link this repo (or copy the deployment token).
# Repository secrets:
#   AZURE_STATIC_WEB_APPS_API_TOKEN — Deployment token from Azure (SWA → Manage deployment token).
# Optional:
#   VITE_API_BASE_URL — HTTPS origin of your deployed API (no trailing slash), e.g. https://your-api.azurewebsites.net

name: Azure Static Web Apps — frontend

on:
  push:
    branches:
      - phase-6
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - phase-6
      - main

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /frontend
          api_location: ''
          output_location: dist
          app_build_command: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close SWA PR environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
